name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p buildsrc
          ZIP_FILE="$(find . -maxdepth 3 -type f \( -name '*.zip' -o -name '*.ZIP' \) -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Android project
        shell: bash
        run: |
          SETTINGS_FILE="$(find buildsrc -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            echo "Files found:"
            find buildsrc -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle --version
          gradle :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: "**/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
