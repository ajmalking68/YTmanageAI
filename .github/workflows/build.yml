name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p buildsrc

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Find and build Android project
        shell: bash
        run: |
          GRADLEW="$(find buildsrc -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            echo "Files found:"
            find buildsrc -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project: $PROJECT_DIR"

          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"

          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: "**/build/outputs/bundle/release/*.aab"
